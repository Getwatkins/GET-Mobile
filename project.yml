name: GETMobile
options:
  bundleIdPrefix: com.getwatkins
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  GETMobile:
    type: application
    platform: iOS
    # Keep every file under GETMobile/ in the app bundle. XcodeGen picks up
    # .swift sources and bundled resources automatically; do not add a
    # `resources:` key and do not exclude the asset/data directories.
    #
    # Excluding Assets.xcassets / Flash/Data / Diagnostics/Data shrinks the IPA
    # (e.g. from ~2.8 MB to ~0.5 MB) and makes required runtime files like
    # box_codes.csv, patch binaries, and Assets.car disappear from GETMobile.app.
    sources:
      - path: GETMobile
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getwatkins.getmobile
        PRODUCT_NAME: GETMobile
        INFOPLIST_KEY_CFBundleDisplayName: GET Mobile
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "GET Mobile connects to supported Wi-Fi OBD and GVRET bridges on your local network."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "GET Mobile uses Bluetooth to connect to supported diagnostic bridges."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Without a launch screen declared, iOS runs the app in a legacy
        # "compatibility" mode: the UI is scaled up ("zoomed in") and does not
        # fit the screen. Xcode flags this in every build log as
        # "A launch configuration or launch storyboard or xib must be provided".
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
