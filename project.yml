name: GETMobile
options:
  bundleIdPrefix: com.getwatkins
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  GETMobile:
    type: application
    platform: iOS
    # Everything under GETMobile/ is picked up automatically: .swift files are
    # compiled; Assets.xcassets (-> Assets.car), the *.csv data files and the
    # *.bin unlock patches are copied into the app bundle as resources.
    #
    # NOTE: do not exclude Assets.xcassets / Flash/Data / Diagnostics/Data here and
    # do not add a `resources:` key - XcodeGen has no such target key, it is
    # silently ignored, and the excluded files then never make it into the app
    # (this is what shrank the IPA from ~2.8 MB to ~0.5 MB).
    sources:
      - path: GETMobile
        excludes:
          - "**/*.md"
    # CarPlay (Driving Task category). The scene manifest cannot be expressed as
    # INFOPLIST_KEY_* build settings, so it goes in a generated Info.plist that
    # Xcode merges with the generated keys below. Only the CarPlay role is
    # declared - the phone UI stays the SwiftUI WindowGroup.
    info:
      path: Config/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: CarPlaySceneDelegate
    # Needs an Apple-approved CarPlay entitlement in the signing profile to
    # actually show up in a car - see GETMobile/V72_CARPLAY_NOTES.md.
    entitlements:
      path: Config/GETMobile.entitlements
      properties:
        com.apple.developer.carplay-driving-task: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/GETMobile.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.getwatkins.getmobile
        PRODUCT_NAME: GETMobile
        INFOPLIST_KEY_CFBundleDisplayName: GET Mobile
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "GET Mobile connects to supported Wi-Fi OBD and GVRET bridges on your local network."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "GET Mobile uses GPS speed and distance for the Performance timer (0-60, 1/4 mile and more)."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "GET Mobile uses Bluetooth to connect to supported diagnostic bridges."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Without a launch screen declared, iOS runs the app in a legacy
        # "compatibility" mode: the UI is scaled up ("zoomed in") and does not
        # fit the screen. Xcode flags this in every build log as
        # "A launch configuration or launch storyboard or xib must be provided".
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
