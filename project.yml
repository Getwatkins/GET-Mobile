name: GETMobile
options:
  bundleIdPrefix: com.getwatkins
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  GETMobile:
    type: application
    platform: iOS
    sources:
      - path: GETMobile
        excludes:
          - Assets.xcassets
          - Flash/Data/**
          - Diagnostics/Data/**
          - "*.md"
    resources:
      - path: GETMobile/Assets.xcassets
      - path: GETMobile/Flash/Data/box_codes.csv
      - path: GETMobile/Flash/Data/simos18_1_unlock_patch.bin
      - path: GETMobile/Flash/Data/simos18_10_unlock_patch.bin
      - path: GETMobile/Diagnostics/Data/simos18_ecm_dtcs.csv
      - path: GETMobile/Diagnostics/Data/sae_generic_dtcs.csv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getwatkins.getmobile
        PRODUCT_NAME: GETMobile
        INFOPLIST_KEY_CFBundleDisplayName: GET Mobile
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "GET Mobile connects to supported Wi-Fi OBD and GVRET bridges on your local network."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "GET Mobile uses Bluetooth to connect to supported diagnostic bridges."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
