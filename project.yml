name: GETMobile
options:
  bundleIdPrefix: com.germanelitetuning
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  GETMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GETMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.germanelitetuning.getmobile
        PRODUCT_NAME: GETMobile
        MARKETING_VERSION: "1.0.9"
        CURRENT_PROJECT_VERSION: "10"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: GET Mobile
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required or the app crashes on launch the moment it touches CoreBluetooth -
        # these are the same two strings from the README's manual Xcode instructions,
        # just supplied here instead since this project is generated fresh each build.
        NSBluetoothAlwaysUsageDescription: "GET Mobile uses Bluetooth to connect to your ESP32 diagnostic bridge and read live ECU data."
        NSBluetoothPeripheralUsageDescription: "GET Mobile uses Bluetooth to connect to your ESP32 diagnostic bridge."
