name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build GET Mobile
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository layout
        run: |
          echo "Repository root:"
          pwd
          ls -la
          test -f project.yml || {
            echo "ERROR: project.yml is missing from repository root"
            exit 1
          }

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d GETMobile.xcodeproj || {
            echo "ERROR: XcodeGen did not create GETMobile.xcodeproj"
            exit 1
          }

      - name: List project
        run: xcodebuild -list -project GETMobile.xcodeproj

      # Diagnostics: shows exactly which non-code files the build can see.
      - name: Show bundled-resource inputs
        run: |
          echo "=== project.yml ==="
          cat project.yml
          echo
          echo "=== Non-Swift files under GETMobile/ ==="
          find GETMobile -type f ! -name '*.swift' | sort

      # The old version of this step ran `xcodebuild -exportArchive` with an empty
      # teamID, which always fails ("teamID should be non-empty"). The app is built
      # unsigned anyway, so instead of exporting we archive unsigned and zip the
      # .app into an .ipa ourselves (Payload/GETMobile.app -> GETMobile.ipa).
      # The resulting IPA is UNSIGNED: sign/install it with your sideloading tool.
      - name: Archive and package unsigned IPA
        run: |
          set -euo pipefail

          xcodebuild \
            -project GETMobile.xcodeproj \
            -scheme GETMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/GETMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          APP_PATH="build/GETMobile.xcarchive/Products/Applications/GETMobile.app"
          test -d "$APP_PATH" || {
            echo "ERROR: $APP_PATH not found in archive"
            exit 1
          }

          # Guard: fail the build if bundled resources didn't make it into the app.
          # (A "successful" IPA without these is ~550 KB instead of ~2.8 MB and
          # flashing / DTC lookup / the app icon silently break.)
          MISSING=0
          for f in box_codes.csv \
                   simos18_1_unlock_patch.bin \
                   simos18_10_unlock_patch.bin \
                   simos18_ecm_dtcs.csv \
                   sae_generic_dtcs.csv \
                   Assets.car; do
            if [ ! -e "$APP_PATH/$f" ]; then
              echo "ERROR: $f is missing from the app bundle"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "=== Contents of the built app bundle ==="
            ls -la "$APP_PATH"
            echo "Check that these files exist under GETMobile/ in the repo:"
            echo "  GETMobile/Flash/Data/  (box_codes.csv, simos18_1_unlock_patch.bin, simos18_10_unlock_patch.bin)"
            echo "  GETMobile/Diagnostics/Data/  (simos18_ecm_dtcs.csv, sae_generic_dtcs.csv)"
            echo "  GETMobile/Assets.xcassets/  (AccentColor.colorset, AppIcon.appiconset, LogoBanner.imageset)"
            exit 1
          fi

          rm -rf build/output build/Payload
          mkdir -p build/output build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry output/GETMobile.ipa Payload)
          rm -rf build/Payload

          ls -lh build/output/*.ipa || {
            echo "ERROR: IPA file was not created"
            exit 1
          }

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GETMobile-ipa
          path: build/output/GETMobile.ipa
          if-no-files-found: error
