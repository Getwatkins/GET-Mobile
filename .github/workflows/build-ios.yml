name: iOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build GET Mobile
    runs-on: macos-latest

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project configuration
        run: |
          echo "Repository root:"
          pwd
          ls -la
          test -f project.yml || {
            echo "ERROR: project.yml is missing from repository root"
            exit 1
          }

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d GETMobile.xcodeproj || {
            echo "ERROR: XcodeGen did not create GETMobile.xcodeproj"
            exit 1
          }

      - name: Verify scheme
        run: |
          xcodebuild -list -project GETMobile.xcodeproj

      - name: Verify signing config
        run: |
          test -n "$APPLE_TEAM_ID" || {
            echo "ERROR: APPLE_TEAM_ID secret is required for Sideloadly export"
            exit 1
          }

      - name: Archive app
        run: |
          xcodebuild \
            -project GETMobile.xcodeproj \
            -scheme GETMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/GETMobile.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Create export options
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/GETMobile.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist build/ExportOptions.plist

          ls -lh build/output/*.ipa || {
            echo "ERROR: IPA file was not created"
            exit 1
          }

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GET-Mobile-IPA
          path: build/output/*.ipa
          retention-days: 7