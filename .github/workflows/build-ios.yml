
name: iOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build GET Mobile
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project configuration
        run: |
          echo "Repository root:"
          pwd
          ls -la
          test -f project.yml || {
            echo "ERROR: project.yml is missing from repository root"
            exit 1
          }

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d GETMobile.xcodeproj || {
            echo "ERROR: XcodeGen did not create GETMobile.xcodeproj"
            exit 1
          }

      - name: Verify scheme
        run: |
          xcodebuild -list -project GETMobile.xcodeproj

      - name: Build
        run: |
          xcodebuild \
            -project GETMobile.xcodeproj \
            -scheme GETMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
